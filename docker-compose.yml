services:
  # Base de données PostgreSQL - utilisation du conteneur existant
  postgres:
    image: postgres
    container_name: tablify  # Même nom que votre conteneur existant
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}  # Probablement "postgres" dans votre cas
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"  # On garde le port exposé comme actuellement
    networks:
      - tablify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tablify-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod              # Variables globales
      - ./backend/.env         # Variables spécifiques backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-postgres}
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - tablify-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tablify-frontend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-https://tablify-web-n6fn.onrender.com/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tablify-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  tablify-network:
    driver: bridge
    name: tablify-prod-network

volumes:
  postgres_data_prod:
    name: tablify-postgres-data-prod